<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 220" role="img" aria-label="Platform screen doors along a metro platform">
<defs>
 <linearGradient id="sky" x2="0" y2="1"><stop stop-color="#d8f3ff"/><stop offset="1" stop-color="#8dc5dd"/></linearGradient>
 <linearGradient id="glass" x2="0" y2="1"><stop stop-color="#c7f6ff" stop-opacity=".9"/><stop offset="1" stop-color="#3e83a9" stop-opacity=".82"/></linearGradient>
 <linearGradient id="wall" x2="0" y2="1"><stop stop-color="#eef4f8"/><stop offset="1" stop-color="#c6d5df"/></linearGradient>
 <filter id="shadow" x="-.1" y="-.2" width="1.2" height="1.5"><feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#073250" flood-opacity=".22"/></filter>
</defs>
<!-- station background -->
<path d="M0 0h640v142H0z" fill="url(#sky)"/><path d="M0 95h640v68H0z" fill="url(#wall)"/>
<path d="M0 109h640" stroke="#91a9b8" stroke-width="3"/><path d="M22 118h596" stroke="#fff" stroke-width="3" opacity=".8"/>
<!-- platform screen door frame -->
<g filter="url(#shadow)">
 <path d="M28 31h584v134H28z" fill="#f8fbfd" stroke="#213e56" stroke-width="7" rx="8"/>
 <path d="M38 41h564v112H38z" fill="url(#glass)"/>
 <!-- door panels / mullions -->
 <g fill="#e8f1f6" stroke="#28455b" stroke-width="4">
  <path d="M38 41h12v112H38zM178 41h10v112h-10zM318 41h10v112h-10zM458 41h10v112h-10zM590 41h12v112h-12z"/>
  <path d="M48 137h130v16H48zM188 137h130v16H188zM328 137h130v16H328zM468 137h122v16H468z"/>
 </g>
 <!-- sliding doors shown as paired central panels -->
 <g fill="#d7f3fb" fill-opacity=".56" stroke="#f3fbff" stroke-width="2">
  <path d="M100 56h30v77h-30zM130 56h30v77h-30zM240 56h30v77h-30zM270 56h30v77h-30zM380 56h30v77h-30zM410 56h30v77h-30zM520 56h27v77h-27zM547 56h27v77h-27z"/>
 </g>
 <!-- door indicator lights -->
 <g><rect x="93" y="47" width="75" height="7" rx="3.5" fill="#31c985"/><rect x="233" y="47" width="75" height="7" rx="3.5" fill="#31c985"/><rect x="373" y="47" width="75" height="7" rx="3.5" fill="#31c985"/><rect x="513" y="47" width="65" height="7" rx="3.5" fill="#31c985"/></g>
 <!-- warning decals and sill -->
 <g fill="#ffd350"><path d="M63 111h15l-8 14H55zM203 111h15l-8 14h-15zM343 111h15l-8 14h-15zM483 111h15l-8 14h-15z"/></g>
</g>
<!-- platform edge -->
<path d="M0 165h640v12H0z" fill="#243c50"/><path d="M0 165h640v4H0z" fill="#ffc928"/><path d="M0 177h640v43H0z" fill="#d9e5eb"/>
<path d="M0 186h640" stroke="#a5b8c3" stroke-width="2" stroke-dasharray="16 10"/>
<!-- small control/status badge -->
<g transform="translate(523 10)"><rect width="94" height="25" rx="12.5" fill="#092b54"/><circle cx="14" cy="12.5" r="4" fill="#55e1a4"/><text x="25" y="17" fill="#fff" font-family="Arial,sans-serif" font-size="11" font-weight="700">PSD SYSTEM</text></g>
</svg>
